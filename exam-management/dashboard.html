<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExamFlow — Dashboard</title>
<meta name="description" content="Role-based dashboard for super admins, exam controllers, teachers and students.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<a class="skip-link" href="#dashContent">Skip to dashboard content</a>
<div class="dash-app" id="dashApp">

  <!-- ================ SIDEBAR ================ -->
  <aside class="dash-sidebar" id="sidebar">
    <a class="dash-brand" href="index.html" aria-label="Back to ExamFlow site">
      <span class="dash-brand-mark">EF</span>
      <span class="dash-brand-text">
        ExamFlow
        <em>dashboard</em>
      </span>
    </a>

    <div class="dash-role-badge" id="roleBadge">
      <span class="role-dot"></span>
      <span id="roleBadgeLabel">Admin</span>
    </div>

    <nav class="dash-nav" id="sidebarNav" aria-label="Main navigation"></nav>

    <div class="dash-sidebar-foot">
      <div class="dash-user-mini" id="sidebarUser">
        <span class="dash-avatar" id="sidebarAvatar">--</span>
        <div class="dash-user-info">
          <b id="sidebarName">Loading…</b>
          <small id="sidebarRole">—</small>
        </div>
      </div>
      <a class="dash-logout" href="index.html" title="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </a>
    </div>
  </aside>

  <!-- ================ MAIN ================ -->
  <div class="dash-main">

    <!-- TOP BAR -->
    <header class="dash-topbar">
      <button class="dash-icon-btn dash-menu-btn" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <div class="dash-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="dashSearch" placeholder="Search this view…" aria-label="Search current view" aria-describedby="dashSearchStatus">
        <kbd>/</kbd>
        <span class="sr-only" id="dashSearchStatus" aria-live="polite"></span>
      </div>

      <div class="dash-topbar-tools">
        <button class="dash-icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>

        <button class="dash-icon-btn dash-bell" id="bellBtn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="bell-dot"></span>
        </button>

        <label class="dash-role-switcher" title="Demo: switch role">
          <span>Role</span>
          <select id="roleSwitcher" aria-label="Switch demo role">
            <option value="super-admin">Super Admin</option>
            <option value="admin" selected>Admin</option>
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
          </select>
        </label>

        <div class="dash-avatar-wrap">
          <span class="dash-avatar" id="topAvatar">--</span>
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="dash-content" id="dashContent" aria-live="polite"></main>

  </div>

  <!-- MOBILE OVERLAY -->
  <div class="dash-overlay" id="sidebarOverlay"></div>
</div>

<!-- TOAST -->
<div class="dash-toast" id="dashToast" role="status" aria-live="polite"></div>

<script src="dashboard.js"></script>
</body>
</html>
